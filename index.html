<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05030a">
  <meta name="description" content="PRISM / Event Horizon — a real-time Schwarzschild observatory.">
  <title>PRISM / Event Horizon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23d9a66d' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%2305030a'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23d9a66d' stroke-width='.6' opacity='.5'/%3E%3C/svg%3E">
  <style>
    :root {
      --gold: #d9a66d;
      --ivory: #f3ead8;
      --void: #05030a;
      --dim: rgba(243, 234, 216, 0.42);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--ivory);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: 0.14em;
      cursor: crosshair;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      z-index: 2;
    }
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 3;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(5, 3, 10, 0.55) 100%);
    }
    #hud {
      position: fixed;
      inset: 0;
      z-index: 5;
      padding: max(22px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #hud.on { opacity: 1; }
    .top {
      display: flex;
      justify-content: flex-end;
      gap: 24px;
      align-items: flex-start;
    }
    .clock {
      text-align: right;
      font-size: 10px;
      color: var(--dim);
      letter-spacing: 0.2em;
    }
    .clock b {
      display: block;
      margin-top: 8px;
      color: var(--ivory);
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }
    .clock b span { color: var(--gold); }
    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }
    .tele {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      pointer-events: none;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(12, 10, 16, 0.28);
      backdrop-filter: blur(26px) saturate(190%) brightness(1.35);
      -webkit-backdrop-filter: blur(26px) saturate(190%) brightness(1.35);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 18px 40px rgba(0, 0, 0, 0.28);
    }
    .tele span {
      min-width: 88px;
      padding: 6px 12px;
      font-size: 9px;
      color: var(--dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .tele b {
      display: block;
      margin-top: 5px;
      color: var(--ivory);
      font-size: 13px;
      letter-spacing: 0.1em;
      font-weight: 500;
    }
    .hint {
      font-size: 9px;
      color: var(--dim);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .audio-wrap {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    button.audio {
      pointer-events: auto;
      cursor: pointer;
      background: rgba(12, 10, 16, 0.4);
      color: var(--ivory);
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font: 500 10px/1 "IBM Plex Mono", ui-monospace, monospace;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      backdrop-filter: blur(26px) saturate(190%) brightness(1.35);
      -webkit-backdrop-filter: blur(26px) saturate(190%) brightness(1.35);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 1px rgba(217, 166, 109, 0.35);
    }
    button.audio:hover { color: var(--gold); }
    #wave {
      height: 22px;
      width: 108px;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      justify-content: flex-end;
    }
    #wave i {
      display: block;
      width: 2px;
      background: var(--gold);
      opacity: 0.85;
      height: 3px;
    }
    .lb {
      position: fixed;
      left: 0; right: 0;
      height: 16vh;
      background: #020107;
      z-index: 7;
      pointer-events: none;
      transition: height 1.6s cubic-bezier(.22,1,.36,1);
    }
    .lb.top { top: 0; }
    .lb.bot { bottom: 0; }
    body.live .lb { height: 0; }
    #fail {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
      z-index: 20;
      font-size: 13px;
      letter-spacing: 0.08em;
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      .tele span { min-width: 72px; padding: 4px 8px; }
      .clock { display: none; }
      .hint { max-width: 100%; }
      .audio-wrap { width: 100%; align-items: stretch; }
      button.audio { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #hud { opacity: 1; }
      .lb { height: 0; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="grain"></div>
  <div id="vignette"></div>
  <i class="lb top"></i>
  <i class="lb bot"></i>
  <div id="hud">
    <div class="top">
      <div class="clock">
        Proper time τ
        <b id="tau">00:00.<span>00</span></b>
        <div style="margin-top:14px">Radius <b id="rad" style="font-size:13px;margin-top:4px">16.2 Rs</b></div>
        <div style="margin-top:10px">Redshift z <b id="zed" style="font-size:13px;margin-top:4px">0.032</b></div>
        <div style="margin-top:10px">Layer <b id="layer" style="font-size:13px;margin-top:4px">THE WELL</b></div>
      </div>
    </div>
    <div class="bottom">
      <div>
        <div class="hint" id="hint">Drag to orbit · scroll to descend · click to drop mass</div>
        <div class="tele">
          <span>FPS<b id="fps">—</b></span>
          <span>Particles<b id="pc">—</b></span>
          <span>Worlds<b id="pr">—</b></span>
          <span>Steps<b id="st">—</b></span>
          <span>Pulse<b id="pu">0.00</b></span>
        </div>
      </div>
      <div class="audio-wrap">
        <button class="audio" id="au" type="button">[ Audio // Initialize ]</button>
        <div id="wave"></div>
      </div>
    </div>
  </div>
  <div id="fail"></div>
  <script>
  (() => {
    const canvas = document.getElementById("c");
    const failEl = document.getElementById("fail");
    const mobile = matchMedia("(pointer: coarse)").matches || innerWidth < 740;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches
      || /(?:\?|&)live=1(?:&|$)/.test(location.search);

    function showFail(msg) {
      failEl.style.display = "flex";
      failEl.textContent = msg;
    }

    const gl = canvas.getContext("webgl2", {
      alpha: false,
      antialias: false,
      depth: true,
      powerPreference: "high-performance",
      premultipliedAlpha: false
    });
    if (reduced) {
      document.getElementById("hud").classList.add("on");
      document.body.classList.add("live");
    }

    if (!gl) {
      showFail("WebGL2 is required for PRISM. Enable it in your browser settings.");
      return;
    }

    const extColor = gl.getExtension("EXT_color_buffer_float") || gl.getExtension("EXT_color_buffer_half_float");
    const extLinear = gl.getExtension("OES_texture_float_linear");
    const canHDR = !!(extColor && gl.getExtension("EXT_color_buffer_float"));

    function compile(type, src, name) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error((name || "shader") + "\n" + gl.getShaderInfoLog(s));
      }
      return s;
    }
    function makeProgram(vs, fs, name) {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, vs, name + " VS"));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, name + " FS"));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        throw new Error(name + " link\n" + gl.getProgramInfoLog(p));
      }
      const u = {}, a = {};
      const nu = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < nu; i++) {
        const info = gl.getActiveUniform(p, i);
        u[info.name.replace(/[0-9\[\]]+$/, "")] = gl.getUniformLocation(p, info.name);
        u[info.name] = gl.getUniformLocation(p, info.name);
      }
      const na = gl.getProgramParameter(p, gl.ACTIVE_ATTRIBUTES);
      for (let i = 0; i < na; i++) {
        const info = gl.getActiveAttrib(p, i);
        a[info.name] = gl.getAttribLocation(p, info.name);
      }
      return { p, u, a };
    }

    const VS_QUAD = `#version 300 es
    in vec2 aPos;
    out vec2 vUv;
    void main(){
      vUv = aPos * 0.5 + 0.5;
      gl_Position = vec4(aPos, 0.0, 1.0);
    }`;

    const FS_BH = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;
    uniform vec2 uRes;
    uniform vec3 uCamPos, uCamFwd, uCamRight, uCamUp;
    uniform float uTime, uFov, uExposure, uPulse, uPulseAmp, uSteps, uCamDist;

    vec3 hsv2rgb(vec3 c){
      vec4 K = vec4(1.0, 2.0/3.0, 1.0/3.0, 3.0);
      vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
      return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
    }
    float hash13(vec3 p){
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    vec3 blackbody(float t){
      vec3 cold = vec3(0.35, 0.05, 0.015);
      vec3 warm = vec3(1.0, 0.38, 0.08);
      vec3 gold = vec3(1.0, 0.72, 0.38);
      vec3 hot  = vec3(1.15, 0.95, 0.82);
      vec3 c = mix(cold, warm, smoothstep(0.0, 0.28, t));
      c = mix(c, gold, smoothstep(0.22, 0.62, t));
      c = mix(c, hot,  smoothstep(0.55, 1.0, t));
      return c;
    }
    vec3 starfield(vec3 dir){
      vec3 col = vec3(0.004, 0.005, 0.012);
      float band = exp(-pow(dir.y * 2.4, 2.0));
      col += vec3(0.22, 0.18, 0.28) * band * 0.07;
      col += vec3(0.55, 0.32, 0.12) * exp(-pow(dir.y * 1.4 - 0.15, 2.0) * 8.0) * 0.03;
      for (int k = 0; k < 3; k++){
        float scale = exp2(float(k) * 1.85 + 5.0);
        vec3 p = dir * scale;
        vec3 id = floor(p);
        vec3 f = fract(p) - 0.5;
        float n = hash13(id);
        float br = smoothstep(0.93, 0.998, n);
        float d2 = dot(f, f);
        vec3 tint = mix(vec3(0.75, 0.85, 1.15), vec3(1.1, 0.85, 0.55), hash13(id + 4.2));
        col += br * tint * exp(-d2 * 46.0) * (0.35 + 0.8 * hash13(id + 9.1));
      }
      return col;
    }
    vec3 galaxyBand(vec3 dir, float seed){
      float d = dir.y * 0.94 + dir.x * 0.16;
      float band = exp(-d * d * 22.0);
      float a = atan(dir.z, dir.x) + seed;
      float r = length(dir.xz);
      float arm = 0.45 + 0.55 * sin(a * 2.0 + r * 8.0 + seed * 3.0);
      float dust = 0.55 + 0.45 * sin(a * 5.0 - r * 13.0);
      vec3 gold = vec3(1.0, 0.70, 0.36);
      vec3 ash = vec3(0.28, 0.16, 0.12);
      return mix(ash, gold, arm * dust) * band * 0.30;
    }
    vec3 distantGalaxies(vec3 dir){
      vec3 col = vec3(0.0);
      for (int i = 0; i < 5; i++){
        float fi = float(i) + 1.7;
        vec3 c = normalize(vec3(
          hash13(vec3(fi, 0.2, 1.3)) * 2.0 - 1.0,
          (hash13(vec3(fi, 4.1, 0.8)) - 0.5) * 0.85,
          hash13(vec3(fi, 2.6, 7.2)) * 2.0 - 1.0
        ));
        float ang = 1.0 - clamp(dot(dir, c), -1.0, 1.0);
        float core = exp(-ang * 1600.0);
        float halo = exp(-ang * 220.0);
        vec3 tint = mix(vec3(0.55, 0.48, 0.85), vec3(1.05, 0.72, 0.38), hash13(vec3(fi, 3.3, 9.1)));
        col += tint * (core * 0.45 + halo * 0.035);
      }
      return col;
    }
    vec3 innerCosmos(vec3 dir){
      vec3 d2 = normalize(vec3(dir.z, -dir.x, dir.y));
      vec3 col = starfield(d2) * 1.55;
      col += galaxyBand(d2, 2.4) * 3.2;
      col += galaxyBand(d2.zxy, 5.1) * 1.4;
      col += distantGalaxies(d2.zxy) * 1.1;
      float rho = length(d2.xz);
      float ring = exp(-abs(rho - 0.22) * 28.0) * (1.0 - abs(d2.y));
      col += vec3(1.15, 0.74, 0.38) * ring * 1.35;
      float well = smoothstep(0.08, 0.018, length(d2.xz - vec2(0.10, -0.03)));
      col *= 1.0 - well * 0.92;
      col += vec3(1.2, 0.8, 0.42) * well * 0.12;
      return col;
    }
    float diskNoise(vec2 xz, float r, float t){
      float a = atan(xz.y, xz.x);
      float spiral = a * 2.4 + r * 0.55 - t * 1.35;
      float arms = 0.52 + 0.48 * sin(spiral);
      arms *= 0.6 + 0.4 * sin(a * 5.0 - t * 2.1 + r * 0.8);
      float hotspots = pow(0.5 + 0.5 * sin(a * 9.0 + t * 3.4 - r * 1.6), 3.5);
      float ripple = 0.82 + 0.18 * sin(r * 5.5 - t * 2.2);
      return arms * ripple * (0.72 + 0.5 * hotspots);
    }

    const float RS = 1.0;
    const float DISK_IN = 3.02;
    const float DISK_OUT = 15.5;

    void main(){
      vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
      vec3 rd = normalize(uCamFwd + uv.x * uCamRight * uFov + uv.y * uCamUp * uFov);
      vec3 pos = uCamPos;
      vec3 vel = rd;

      vec3 Lvec = cross(pos, vel);
      float L2 = dot(Lvec, Lvec);

      vec3 col = vec3(0.0);
      float transmit = 1.0;
      float minR = length(pos);
      bool captured = false;
      bool escaped = false;
      int hits = 0;
      int maxSteps = int(uSteps + 0.5);

      for (int i = 0; i < 120; i++){
        if (i >= maxSteps) break;
        float r = length(pos);
        minR = min(minR, r);
        if (r < 1.02) { captured = true; break; }
        if (r > 110.0 && i > 6) { escaped = true; break; }

        float h = 0.15 * clamp(r - 0.42, 0.045, 3.2);
        float r5 = r * r * r * r * r;
        vec3 acc = (-1.5 * RS * L2 / max(r5, 1e-6)) * pos;
        vec3 p1 = pos + vel * h + 0.5 * acc * h * h;
        float r1 = length(p1);
        float r15 = r1 * r1 * r1 * r1 * r1;
        vec3 acc1 = (-1.5 * RS * L2 / max(r15, 1e-6)) * p1;
        vec3 prev = pos;
        vel = vel + 0.5 * (acc + acc1) * h;
        pos = p1;

        if (prev.y * pos.y < 0.0 && hits < 3){
          float tHit = prev.y / (prev.y - pos.y);
          vec3 hit = mix(prev, pos, clamp(tHit, 0.0, 1.0));
          float rho = length(hit.xz);
          if (rho > DISK_IN && rho < DISK_OUT){
            hits++;
            float xr = DISK_IN / rho;
            float temp = pow(DISK_IN / rho, 0.75) * pow(max(0.001, 1.0 - sqrt(xr)), 0.25);
            float gRed = sqrt(max(0.02, 1.0 - RS / rho));
            temp *= gRed;
            float vk = sqrt(0.5 / rho);
            vec3 tng = normalize(vec3(-hit.z, 0.0, hit.x));
            vec3 vdisk = tng * vk;
            vec3 phDir = normalize(-vel);
            float ndotv = dot(phDir, vdisk);
            float dop = sqrt(max(0.05, 1.0 - vk * vk)) / max(0.12, 1.0 - ndotv);
            float beam = pow(clamp(dop, 0.25, 3.6), 3.2);
            float n = diskNoise(hit.xz, rho, uTime);
            float edge = smoothstep(DISK_IN, DISK_IN + 0.55, rho) * smoothstep(DISK_OUT, DISK_OUT - 3.2, rho);
            float pulse = exp(-abs(rho - uPulse) * 3.4) * uPulseAmp;
            vec3 dcol = blackbody(clamp(temp * 1.35, 0.0, 1.0));
            float dens = n * edge * (1.15 + pulse * 2.4);
            vec3 add = dcol * dens * beam * 2.4;
            add += pulse * hsv2rgb(vec3(fract(rho * 0.12 + uTime * 0.05), 0.62, 1.0)) * 0.55;
            col += transmit * add;
            transmit *= 1.0 - 0.28 * dens;
          }
        }

        float fog = 0.018 / (r * r + 0.8);
        col += transmit * vec3(1.0, 0.62, 0.28) * fog * h * 2.2;
      }

      float reveal = smoothstep(15.0, 4.6, uCamDist);
      float macro = smoothstep(14.0, 30.0, uCamDist);
      vec3 look = normalize(vel);
      if (!captured){
        col += transmit * starfield(look);
        col += transmit * distantGalaxies(look) * (0.35 + 0.9 * macro);
        col += transmit * galaxyBand(look, 0.35) * macro * 0.85;
      } else {
        col *= 0.28;
        col += innerCosmos(look) * (0.4 + 1.7 * reveal);
      }

      float ring = exp(-abs(minR - 1.52) * 18.0);
      if (!captured){
        col += ring * vec3(1.35, 0.92, 0.52) * 1.35;
        col += ring * hsv2rgb(vec3(fract(0.08 + uTime * 0.03 + atan(rd.z, rd.x) * 0.15), 0.5, 0.55)) * 0.18;
      }

      float impact = length(cross(uCamPos, rd));
      float jet = exp(-impact * 2.1) * smoothstep(0.22, 0.9, abs(rd.y)) * 0.06 * (1.0 - reveal * 0.5);
      col += vec3(1.0, 0.68, 0.32) * jet * uExposure;

      col *= uExposure;
      col = col / (1.0 + col * 0.35);
      fragColor = vec4(max(col, 0.0), 1.0);
    }`;

    const FS_BRIGHT = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;
    uniform sampler2D uTex;
    void main(){
      vec3 c = texture(uTex, vUv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float k = smoothstep(0.82, 1.45, l);
      fragColor = vec4(c * k, 1.0);
    }`;

    const FS_BLUR = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;
    uniform sampler2D uTex;
    uniform vec2 uDir;
    void main(){
      vec2 px = uDir;
      vec3 c = texture(uTex, vUv).rgb * 0.227027;
      c += texture(uTex, vUv + px).rgb * 0.1945946;
      c += texture(uTex, vUv - px).rgb * 0.1945946;
      c += texture(uTex, vUv + px * 2.0).rgb * 0.1216216;
      c += texture(uTex, vUv - px * 2.0).rgb * 0.1216216;
      c += texture(uTex, vUv + px * 3.0).rgb * 0.054054;
      c += texture(uTex, vUv - px * 3.0).rgb * 0.054054;
      c += texture(uTex, vUv + px * 4.0).rgb * 0.016216;
      c += texture(uTex, vUv - px * 4.0).rgb * 0.016216;
      fragColor = vec4(c, 1.0);
    }`;

    const FS_COMP = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 fragColor;
    uniform sampler2D uScene, uBloom, uStreak;
    uniform vec2 uRes;
    uniform float uTime, uCA;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec2 c = uv - 0.5;
      float r = length(c);
      vec2 dir = c / (r + 1e-4);
      float ca = uCA * (0.0015 + 0.006 * r * r);
      vec3 col;
      col.r = texture(uScene, uv + dir * ca * 1.4).r;
      col.g = texture(uScene, uv).g;
      col.b = texture(uScene, uv - dir * ca * 1.8).b;
      vec3 bloom = texture(uBloom, uv).rgb;
      vec3 streak = texture(uStreak, uv).rgb;
      col += bloom * 0.52 + streak * 0.38;
      float vig = smoothstep(1.25, 0.25, r);
      col *= vig;
      float g = (hash(gl_FragCoord.xy + fract(uTime) * 17.0) - 0.5) * 0.045;
      col += g;
      col = pow(max(col, 0.0), vec3(0.92));
      fragColor = vec4(col, 1.0);
    }`;

    const VS_PT = `#version 300 es
    in vec4 aData;
    in vec3 aCol;
    uniform mat4 uMVP;
    uniform float uTime, uPulse, uPulseAmp, uCamDist;
    uniform vec3 uMass;
    uniform float uMassG, uPoint;
    out vec3 vCol;
    void main(){
      float r = aData.x;
      float y = aData.y;
      float phase = aData.z;
      float kind = aData.w;
      float omega = (kind < 0.5) ? (0.55 / sqrt(r + 0.2)) : (kind < 1.5 ? 0.045 : 0.85 / sqrt(r + 0.15));
      float a = phase + uTime * omega;
      vec3 pos = vec3(cos(a) * r, y, sin(a) * r);
      float shock = exp(-abs(length(pos.xz) - uPulse) * 2.8) * uPulseAmp;
      pos.y += shock * 0.28;
      vec3 d = pos - uMass;
      float d2 = dot(d, d) + 0.55;
      pos += d * (-uMassG / d2);
      float vis = 1.0;
      if (kind > 0.5 && kind < 1.5) vis = smoothstep(11.0, 22.0, uCamDist);
      else if (kind > 1.5) vis = smoothstep(12.0, 5.2, uCamDist);
      else vis = mix(0.45, 1.0, smoothstep(40.0, 16.0, uCamDist));
      gl_Position = uMVP * vec4(pos, 1.0);
      float size = (kind < 0.5) ? 2.2 : (kind < 1.5 ? 2.8 : 1.7);
      size += shock * 3.2;
      gl_PointSize = vis * size * uPoint / max(gl_Position.w, 0.4);
      vCol = aCol + shock * vec3(1.0, 0.5, 0.14);
      vCol *= vis * 0.48 / (0.16 + length(pos) * 0.045);
    }`;

    const FS_PT = `#version 300 es
    precision mediump float;
    in vec3 vCol;
    out vec4 o;
    void main(){
      vec2 p = gl_PointCoord * 2.0 - 1.0;
      float d = dot(p, p);
      if (d > 1.0) discard;
      float g = exp(-d * 3.4);
      o = vec4(vCol * g, 1.0);
    }`;

    const VS_PRISM = `#version 300 es
    in vec3 aPos;
    in vec3 aNrm;
    in vec4 aInstA;
    in vec4 aInstB;
    uniform mat4 uMVP;
    uniform float uTime;
    out vec3 vN, vW, vColHint;
    void main(){
      float r = aInstA.x;
      float phase = aInstA.y;
      float y = aInstA.z;
      float scale = aInstA.w;
      float spin = aInstB.x;
      float tilt = aInstB.y;
      float seed = aInstB.z;
      float omega = 0.11 / sqrt(r + 0.8);
      float a = phase + uTime * omega;
      vec3 orbit = vec3(cos(a) * r, y, sin(a) * r);
      float c = cos(uTime * spin * 0.15), s = sin(uTime * spin * 0.15);
      float ct = cos(tilt), st = sin(tilt);
      mat3 rotY = mat3(c,0.0,s, 0.0,1.0,0.0, -s,0.0,c);
      mat3 rotX = mat3(1.0,0.0,0.0, 0.0,ct,-st, 0.0,st,ct);
      mat3 R = rotY * rotX;
      vec3 wp = orbit + R * (aPos * scale);
      vW = wp;
      vN = normalize(R * aNrm);
      vColHint = vec3(seed, scale, r);
      gl_Position = uMVP * vec4(wp, 1.0);
    }`;

    const FS_PRISM = `#version 300 es
    precision highp float;
    in vec3 vN, vW, vColHint;
    uniform vec3 uCamPos;
    uniform float uTime, uPulseAmp;
    out vec4 o;
    float hash13(vec3 p){
      p = fract(p * 0.1031);
      p += dot(p, p.yzx + 33.33);
      return fract((p.x + p.y) * p.z);
    }
    void main(){
      vec3 n = normalize(vN);
      vec3 v = normalize(uCamPos - vW);
      vec3 L = normalize(-vW);
      float ndl = max(0.0, dot(n, L));
      float wrap = clamp(dot(n, L) * 0.55 + 0.45, 0.0, 1.0);
      float crater = hash13(floor(n * 9.0 + vColHint.x * 7.0));
      float grain = hash13(n * 18.0 + vColHint.x);
      vec3 rock = mix(vec3(0.055, 0.048, 0.042), vec3(0.16, 0.12, 0.09), crater);
      rock = mix(rock, vec3(0.10, 0.09, 0.08), grain * 0.45);
      if (vColHint.x > 0.62) rock = mix(rock, vec3(0.12, 0.11, 0.13), 0.35);
      float illum = 1.6 / (length(vW) * 0.07 + 0.45);
      vec3 gold = vec3(1.0, 0.70, 0.34) * ndl * illum;
      float fres = pow(1.0 - max(dot(n, v), 0.0), 3.4);
      vec3 atmos = vec3(1.0, 0.74, 0.42) * fres * ndl * 0.42;
      vec3 col = rock * (0.06 + wrap * 0.55) + gold * rock * 3.2 + atmos;
      col += uPulseAmp * gold * 0.12;
      vec3 rd = normalize(vW - uCamPos);
      float tca = dot(-uCamPos, rd);
      float dist = length(vW - uCamPos);
      if (tca > 0.0 && tca < dist){
        float d2 = dot(uCamPos, uCamPos) - tca * tca;
        if (d2 < 1.05) discard;
      }
      o = vec4(col, 1.0);
    }`;

    const VS_INFALL = `#version 300 es
    in vec3 aPos;
    uniform mat4 uMVP;
    uniform float uPoint;
    out vec3 vCol;
    void main(){
      gl_Position = uMVP * vec4(aPos, 1.0);
      gl_PointSize = 7.0 * uPoint / max(gl_Position.w, 0.35);

    let progBH, progBright, progBlur, progComp, progPt, progPrism, progInfall;
    try {
      progBH = makeProgram(VS_QUAD, FS_BH, "BH");
      progBright = makeProgram(VS_QUAD, FS_BRIGHT, "BRIGHT");
      progBlur = makeProgram(VS_QUAD, FS_BLUR, "BLUR");
      progComp = makeProgram(VS_QUAD, FS_COMP, "COMP");
      progPt = makeProgram(VS_PT, FS_PT, "PT");

    const quad = gl.createBuffer();

    const nDisk = mobile ? 8000 : 20000;
    const nGal  = mobile ? 4000 : 14000;
    const nInner = mobile ? 1800 : 6000;
    const nP = nDisk + nGal + nInner;
    const pData = new Float32Array(nP * 4);
    const pCol = new Float32Array(nP * 3);
    let pi = 0;
    function pushP(r, y, phase, kind, col) {

    }
    for (let i = 0; i < nDisk; i++) {

      const t = Math.max(0, 1 - (r - 3.15) / 12);
      pushP(r, y, Math.random() * 6.283, 0, [
        0.62 + 0.45 * t, 0.22 + 0.38 * t, 0.07 + 0.12 * t
      ]);
    }
    for (let i = 0; i < nGal; i++) {
      const arm = i % 3;
      const r = 18 + Math.pow(Math.random(), 0.45) * 42;
      const a = arm * 2.094 + r * 0.32 + (Math.random() - 0.5) * 0.55;
      const y = (Math.random() - 0.5) * (0.7 + r * 0.035);
      const t = Math.exp(-Math.abs(y) * 0.35);
      pushP(r, y, a, 1, [0.55 * t, 0.32 * t, 0.16 * t]);
    }
    for (let i = 0; i < nInner; i++) {
      const r = 1.55 + Math.pow(Math.random(), 0.7) * 2.4;
      const y = (Math.random() - 0.5) * 0.08;
      const t = Math.max(0, 1 - (r - 1.55) / 2.4);
      pushP(r, y, Math.random() * 6.283, 2, [
        0.85 + 0.4 * t, 0.38 + 0.28 * t, 0.12

    }
    const pBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);
    gl.bufferData(gl.ARRAY_BUFFER, pData, gl.STATIC_DRAW);
    const pColBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, pColBuf);
    gl.bufferData(gl.ARRAY_BUFFER, pCol, gl.STATIC_DRAW);
    const vaoPt = gl.createVertexArray();
    gl.bindVertexArray(vaoPt);
    gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);
    gl.enableVertexAttribArray(progPt.a.aData);
    gl.vertexAttribPointer(progPt.a.aData, 4, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, pColBuf);
    gl.enableVertexAttribArray(progPt.a.aCol);
    gl.vertexAttribPointer(progPt.a.aCol, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    function sphereMesh(lat, lon) {
      const verts = [];
      for (let y = 0; y <= lat; y++) {
        const phi = y / lat * Math.PI;
        for (let x = 0; x <= lon; x++) {
          const th = x / lon * Math.PI * 2;
          const px = Math.sin(phi) * Math.cos(th);
          const py = Math.cos(phi);
          const pz = Math.sin(phi) * Math.sin(th);
          verts.push([px, py, pz]);
        }
      }
      const pos = [], nrm = [];
      const cols = lon + 1;
      for (let y = 0; y < lat; y++) {
        for (let x = 0; x < lon; x++) {
          const a = verts[y * cols + x], b = verts[(y + 1) * cols + x];
          const c = verts[y * cols + x + 1], d = verts[(y + 1) * cols + x + 1];
          for (const P of [a, b, c, c, b, d]) {
            pos.push(...P);
            nrm.push(...P);
          }
        }
      }
      return { pos: new Float32Array(pos), nrm: new Float32Array(nrm), count: pos.length / 3 };
    }
    const mesh = sphereMesh(mobile ? 10 : 14, mobile ? 16 : 22);
    const worldR = mobile
      ? [4.6, 6.4, 9.2, 13.5, 19, 28, 38, 52]
      : [3.9, 5.2, 6.8, 9.1, 12.4, 16.8, 22.5, 29, 38, 48, 58, 8.3, 11.2, 18.6];
    const nPrism = worldR.length;
    const instA = new Float32Array(nPrism * 4);
    const instB = new Float32Array(nPrism * 4);
    for (let i = 0; i < nPrism; i++) {
      const r = worldR[i];
      const inner = r < 8;
      instA[i*4] = r;
      instA[i*4+1] = i * 1.7 + 0.4;
      instA[i*4+2] = (i % 2 ? 0.18 : -0.14) * (inner ? 0.4 : 1);
      instA[i*4+3] = inner ? (0.07 + (i % 3) * 0.025) : (0.13 + (i % 5) * 0.035);
      instB[i*4] = 0.25 + (i % 7) * 0.11;
      instB[i*4+1] = (i % 2 ? 0.22 : -0.18);
      instB[i*4+2] = (i * 0.17) % 1;
      instB[i*4+3] = i;
    }
    const prismPosBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, prismPosBuf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.pos, gl.STATIC_DRAW);
    const prismNrmBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, prismNrmBuf);
    gl.bufferData(gl.ARRAY_BUFFER, mesh.nrm, gl.STATIC_DRAW);
    const instABuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instABuf);
    gl.bufferData(gl.ARRAY_BUFFER, instA, gl.STATIC_DRAW);
    const instBBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instBBuf);
    gl.bufferData(gl.ARRAY_BUFFER, instB, gl.STATIC_DRAW);
    const vaoPrism = gl.createVertexArray();
    gl.bindVertexArray(vaoPrism);
    gl.bindBuffer(gl.ARRAY_BUFFER, prismPosBuf);
    gl.enableVertexAttribArray(progPrism.a.aPos);
    gl.vertexAttribPointer(progPrism.a.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, prismNrmBuf);
    gl.enableVertexAttribArray(progPrism.a.aNrm);
    gl.vertexAttribPointer(progPrism.a.aNrm, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instABuf);
    gl.enableVertexAttribArray(progPrism.a.aInstA);
    gl.vertexAttribPointer(progPrism.a.aInstA, 4, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(progPrism.a.aInstA, 1);
    gl.bindBuffer(gl.ARRAY_BUFFER, instBBuf);
    gl.enableVertexAttribArray(progPrism.a.aInstB);
    gl.vertexAttribPointer(progPrism.a.aInstB, 4, gl.FLOAT, false, 0, 0);
    gl.vertexAttribDivisor(progPrism.a.aInstB, 1);
    gl.bindVertexArray(null);

    const infalls = [];
    const infallBuf = gl.createBuffer();
    const vaoInfall = gl.createVertexArray();
    gl.bindVertexArray(vaoInfall);
    gl.bindBuffer(gl.ARRAY_BUFFER, infallBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(16 * 3), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(progInfall.a.aPos);
    gl.vertexAttribPointer(progInfall.a.aPos, 3, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);

    function makeTarget(w, h, hdr, depth) {
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      const intern = hdr && canHDR ? gl.RGBA16F : gl.RGBA8;
      const type = hdr && canHDR ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE;
      gl.texImage2D(gl.TEXTURE_2D, 0, intern, w, h, 0, gl.RGBA, type, null);

      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);

      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);

        if (hdr) return makeTarget(w, h, false, depth);

    }

    let scene, bright, blurA, blurB, streak, rtW = 0, rtH = 0, bloomW = 0, bloomH = 0;
    let steps = mobile ? 42 : 72;
    const stepsTarget = steps;
    let renderScale = mobile ? 0.52 : Math.min(1, 1400 / Math.max(innerWidth, 1));

    function resizeRT() {
      const dpr = Math.min(devicePixelRatio || 1, mobile ? 1.5 : 2);
      canvas.width = Math.max(2, Math.floor(innerWidth * dpr));
      canvas.height = Math.max(2, Math.floor(innerHeight * dpr));
      const w = Math.max(2, Math.floor(canvas.width * renderScale));
      const h = Math.max(2, Math.floor(canvas.height * renderScale));
      if (w === rtW && h === rtH) return;

      bloomW = Math.max(2, w >> 1);
      bloomH = Math.max(2, h >> 1);

      blurA = makeTarget(bloomW, bloomH, true);
      blurB = makeTarget(bloomW, bloomH, true);

    }
    resizeRT();
    addEventListener("resize", () => { renderScale = mobile ? 0.52 : Math.min(1, 1400 / Math.max(innerWidth, 1)); resizeRT(); }, { passive: true });

    function perspective(fov, aspect, near, far) {
      const f = 1 / Math.tan(fov / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }
    function lookAt(ex, ey, ez) {
      let zx = ex, zy = ey, zz = ez;
      let zl = 1 / Math.hypot(zx, zy, zz);
      zx *= zl; zy *= zl; zz *= zl;
      let xx = 0 * zz - 1 * zy, xy = 1 * zx - 0 * zz, xz = 0 * zy - 0 * zx;
      if (Math.hypot(xx, xy, xz) < 1e-5) { xx = 1; xy = 0; xz = 0; }
      let xl = 1 / Math.hypot(xx, xy, xz);
      xx *= xl; xy *= xl; xz *= xl;
      const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
      return new Float32Array([
        xx, yx, zx, 0,
        xy, yy, zy, 0,
        xz, yz, zz, 0,
        -(xx*ex + xy*ey + xz*ez),
        -(yx*ex + yy*ey + yz*ez),
        -(zx*ex + zy*ey + zz*ez), 1

        for (let r = 0; r < 4; r++) {
          o[c*4+r] = a[0*4+r]*b[c*4+0] + a[1*4+r]*b[c*4+1] + a[2*4+r]*b[c*4+2] + a[3*4+r]*b[c*4+3];
        }
      }
      return o;
    }
    function basis(yaw, pitch, dist) {
      const cp = Math.cos(pitch), sp = Math.sin(pitch);
      const cy = Math.cos(yaw), sy = Math.sin(yaw);
      const x = dist * cy * cp, y = dist * sp, z = dist * sy * cp;
      const pos = [x, y, z];
      const fl = Math.hypot(x, y, z) || 1;
      const fwd = [-x/fl, -y/fl, -z/fl];
      let right = [fwd[1]*0 - fwd[2]*1, fwd[2]*0 - fwd[0]*0, fwd[0]*1 - fwd[1]*0];
      let rl = Math.hypot(right[0], right[1], right[2]);
      if (rl < 1e-5) right = [1, 0, 0];
      else { right[0]/=rl; right[1]/=rl; right[2]/=rl; }
      const up = [
        right[1]*fwd[2] - right[2]*fwd[1],
        right[2]*fwd[0] - right[0]*fwd[2],
        right[0]*fwd[1] - right[1]*fwd[0]
      ];
      return { pos, fwd, right, up };
    }

    const DIST_MIN = 2.32;
    const DIST_MAX = 68;
    const qDist = parseFloat(new URLSearchParams(location.search).get("dist") || "");
    const cam = {
      yaw: 0.55,
      pitch: 0.38,
      dist: Number.isFinite(qDist) ? Math.max(DIST_MIN, Math.min(DIST_MAX, qDist)) : (reduced ? 16.4 : 26),
      vy: 0, vp: 0, vd: 0,
      auto: true
    };
    let down = false, lx = 0, ly = 0, pinch = 0;
    let pulse = 8, pulseAmp = 0;
    let mass = [8, 0, 0], massG = 0;
    let pointer = { x: 0, y: 0 };
    let exposure = reduced ? 1 : 0;

    canvas.addEventListener("pointerdown", (e) => {
      down = true;
      cam.auto = false;
      lx = e.clientX; ly = e.clientY;

    });
    addEventListener("pointerup", () => { down = false; });
    addEventListener("pointermove", (e) => {
      pointer.x = e.clientX; pointer.y = e.clientY;
      if (!down) return;

      cam.vp += (e.clientY - ly) * 0.0018;
      lx = e.clientX; ly = e.clientY;
    }, { passive: true });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      cam.auto = false;
      const mag = Math.min(Math.abs(e.deltaY), 90);
      cam.vd += Math.sign(e.deltaY) * mag * 0.018;
    }, { passive: false });
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinch = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY

      }
    }, { passive: true });
    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );

        pinch = d;
      }
    }, { passive: false });

    function spawnInfall(hit) {
      infalls.push({
        r: Math.max(4.2, Math.hypot(hit[0], hit[2])),
        a: Math.atan2(hit[2], hit[0]),
        y: hit[1] * 0.15,
        t: 0
      });

    canvas.addEventListener("click", (e) => {
      pulse = 3.4;
      pulseAmp = 1;
      const b = basis(cam.yaw, cam.pitch, cam.dist);
      const uvx = (e.clientX / innerWidth) * 2 - 1;
      const uvy = 1 - (e.clientY / innerHeight) * 2;
      const aspect = innerWidth / innerHeight;
      const fov = 0.52;
      const rd = [
        b.fwd[0] + b.right[0] * uvx * aspect * fov + b.up[0] * uvy * fov,
        b.fwd[1] + b.right[1] * uvx * aspect * fov + b.up[1] * uvy * fov,
        b.fwd[2] + b.right[2] * uvx * aspect * fov + b.up[2] * uvy * fov
      ];
      const rl = Math.hypot(rd[0], rd[1], rd[2]) || 1;
      rd[0]/=rl; rd[1]/=rl; rd[2]/=rl;
      let hit = [8, 0, 0];
      if (Math.abs(rd[1]) > 1e-4) {
        const t = -b.pos[1] / rd[1];
        if (t > 0) hit = [b.pos[0] + rd[0]*t, 0, b.pos[2] + rd[2]*t];
      }
      mass = hit;
      massG = 1.8;
      spawnInfall(hit);
      spawnInfall([hit[0]*0.92, 0, hit[2]*1.08]);
      pingAudio();
    });

    let ac, analyser, masterGain, filterNode, waveData;
    const auBtn = document.getElementById("au");
    const waveEl = document.getElementById("wave");
    waveEl.innerHTML = Array.from({ length: 22 }, () => "<i></i>").join("");
    const waveBars = [...waveEl.querySelectorAll("i")];

    function pingAudio() {
      if (!ac) return;
      const t = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(220, t);
      o.frequency.exponentialRampToValueAtTime(48, t + 0.7);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
      o.connect(g).connect(masterGain);
      o.start(t); o.stop(t + 0.85);
      const nlen = ac.sampleRate * 0.2;
      const buf = ac.createBuffer(1, nlen, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < nlen; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / nlen);
      const src = ac.createBufferSource();
      src.buffer = buf;
      const bp = ac.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 1.2;
      const ng = ac.createGain(); ng.gain.value = 0.08;
      src.connect(bp).connect(ng).connect(masterGain);
      src.start();
    }

    auBtn.addEventListener("click", async () => {
      if (!ac) {
        ac = new AudioContext();
        masterGain = ac.createGain();
        masterGain.gain.value = 0;
        analyser = ac.createAnalyser();
        analyser.fftSize = 64;
        masterGain.connect(analyser);
        analyser.connect(ac.destination);
        waveData = new Uint8Array(analyser.frequencyBinCount);

        function osc(type, freq, gain, detune) {
          const o = ac.createOscillator();
          o.type = type; o.frequency.value = freq; if (detune) o.detune.value = detune;
          const g = ac.createGain(); g.gain.value = gain;
          o.connect(g).connect(masterGain);
          o.start();
          return o;
        }
        osc("sine", 36.71, 0.2);
        osc("triangle", 73.42, 0.035, 6);
        osc("sine", 110, 0.018, -4);
        osc("sine", 329.63, 0.007);
        osc("sine", 493.88, 0.004, 3);

        const nlen = ac.sampleRate * 2;
        const buf = ac.createBuffer(1, nlen, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < nlen; i++) d[i] = Math.random() * 2 - 1;
        const noise = ac.createBufferSource();
        noise.buffer = buf; noise.loop = true;
        filterNode = ac.createBiquadFilter();
        filterNode.type = "bandpass";
        filterNode.frequency.value = 380;
        filterNode.Q.value = 5;
        const ng = ac.createGain(); ng.gain.value = 0.03;
        noise.connect(filterNode).connect(ng).connect(masterGain);
        noise.start();
        masterGain.gain.linearRampToValueAtTime(0.85, ac.currentTime + 2.4);
      }
      if (ac.state === "suspended") await ac.resume();
      auBtn.textContent = "[ Audio // Online ]";
    });

    document.getElementById("pc").textContent = nP.toLocaleString();
    document.getElementById("pr").textContent = String(nPrism);
    if (mobile) {
      document.getElementById("hint").textContent = "Drag to orbit · pinch to descend · tap to drop mass";
    }

    const t0 = performance.now();
    let last = t0, frames = 0, fpsT = t0, fps = 60;
    let proper = 0;

    let glChecked = false;
    function drawPass(prog, fbo, w, h, tex, unit) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.viewport(0, 0, w, h);
      gl.useProgram(prog.p);
      bindQuad(prog);
      if (tex) {
        gl.activeTexture(gl.TEXTURE0 + (unit || 0));
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.uniform1i(prog.u.uTex, unit || 0);
      }
    }

    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      const t = (now - t0) / 1000;

      if (!reduced) {
        const k = Math.min(t / 3.8, 1);
        const e = 1 - Math.pow(1 - k, 3);
        if (t < 4.2 && !Number.isFinite(qDist)) cam.dist += (16.4 - cam.dist) * (0.6 * dt + 0.015);
        exposure = Math.min(1, Math.max(0, (t - 0.35) / 2.4));
        if (t > 2.4) document.getElementById("hud").classList.add("on");
        if (t > 2.6) document.body.classList.add("live");
      } else {
        exposure = 1;
        document.getElementById("hud").classList.add("on");
        document.body.classList.add("live");
      }

      if (cam.auto && t > 3) cam.vy += 0.018 * dt;
      cam.vy *= 0.9; cam.vp *= 0.9; cam.vd *= 0.86;
      cam.yaw += cam.vy;
      cam.pitch = Math.max(-1.15, Math.min(1.22, cam.pitch + cam.vp));
      cam.dist *= Math.exp(cam.vd * dt * 0.85);
      cam.dist = Math.max(DIST_MIN, Math.min(DIST_MAX, cam.dist));

      pulse += dt * 2.15;
      pulseAmp *= Math.pow(0.22, dt);
      if (pulse > 16) pulse = 3.2;
      massG *= Math.pow(0.15, dt);

      const b = basis(cam.yaw, cam.pitch, cam.dist);
      const aspect = rtW / rtH;
      const fov = 0.55 - 0.12 * Math.max(0, Math.min(1, (12 - cam.dist) / 9));
      const P = perspective(2 * Math.atan(fov), aspect, 0.08, 220);
      const V = lookAt(b.pos[0], b.pos[1], b.pos[2]);
      const MVP = mul4(P, V);

      const uvx = (pointer.x / innerWidth) * 2 - 1;
      const uvy = 1 - (pointer.y / innerHeight) * 2;
      const rd = [
        b.fwd[0] + b.right[0] * uvx * aspect * fov + b.up[0] * uvy * fov,
        b.fwd[1] + b.right[1] * uvx * aspect * fov + b.up[1] * uvy * fov,
        b.fwd[2] + b.right[2] * uvx * aspect * fov + b.up[2] * uvy * fov
      ];
      const rdl = Math.hypot(rd[0], rd[1], rd[2]) || 1;
      if (Math.abs(rd[1] / rdl) > 1e-4) {
        const tt = -b.pos[1] / (rd[1] / rdl);
        if (tt > 0 && massG < 0.05) {
          mass = [b.pos[0] + (rd[0]/rdl)*tt, 0, b.pos[2] + (rd[2]/rdl)*tt];
        }
      }

      for (let i = infalls.length - 1; i >= 0; i--) {
        const s = infalls[i];
        s.t += dt;
        s.a += dt * (1.8 / (s.r + 0.3));
        s.r -= dt * (0.85 + 2.2 / (s.r + 0.2));
        s.y *= 0.99;
        if (s.r < 1.15) {
          pulse = 1.4; pulseAmp = Math.max(pulseAmp, 1.2);
          infalls.splice(i, 1);
          pingAudio();
        }
      }

      const gtt = Math.sqrt(Math.max(0.02, 1 - 1 / cam.dist));
      proper += dt * gtt;

      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);
      gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
      gl.viewport(0, 0, scene.w, scene.h);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      gl.useProgram(progBH.p);
      bindQuad(progBH);
      gl.uniform2f(progBH.u.uRes, scene.w, scene.h);
      gl.uniform3f(progBH.u.uCamPos, b.pos[0], b.pos[1], b.pos[2]);
      gl.uniform3f(progBH.u.uCamFwd, b.fwd[0], b.fwd[1], b.fwd[2]);
      gl.uniform3f(progBH.u.uCamRight, b.right[0], b.right[1], b.right[2]);
      gl.uniform3f(progBH.u.uCamUp, b.up[0], b.up[1], b.up[2]);
      gl.uniform1f(progBH.u.uTime, t);
      gl.uniform1f(progBH.u.uFov, fov);
      gl.uniform1f(progBH.u.uExposure, exposure);
      gl.uniform1f(progBH.u.uPulse, pulse);
      gl.uniform1f(progBH.u.uPulseAmp, pulseAmp);
      gl.uniform1f(progBH.u.uSteps, steps);
      gl.uniform1f(progBH.u.uCamDist, cam.dist);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LESS);
      gl.depthMask(true);
      gl.disable(gl.BLEND);
      gl.useProgram(progPrism.p);
      gl.bindVertexArray(vaoPrism);
      gl.uniformMatrix4fv(progPrism.u.uMVP, false, MVP);
      gl.uniform1f(progPrism.u.uTime, t);
      gl.uniform3f(progPrism.u.uCamPos, b.pos[0], b.pos[1], b.pos[2]);
      gl.uniform1f(progPrism.u.uPulseAmp, pulseAmp);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, mesh.count, nPrism);

      gl.depthMask(false);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(progPt.p);
      gl.bindVertexArray(vaoPt);
      gl.uniformMatrix4fv(progPt.u.uMVP, false, MVP);
      gl.uniform1f(progPt.u.uTime, t);
      gl.uniform1f(progPt.u.uPulse, pulse);
      gl.uniform1f(progPt.u.uPulseAmp, pulseAmp);
      gl.uniform3f(progPt.u.uMass, mass[0], mass[1], mass[2]);
      gl.uniform1f(progPt.u.uMassG, massG);
      gl.uniform1f(progPt.u.uPoint, Math.max(canvas.height / 900, 0.7));
      gl.uniform1f(progPt.u.uCamDist, cam.dist);
      gl.drawArrays(gl.POINTS, 0, nP);

      if (infalls.length) {
        const arr = new Float32Array(infalls.length * 3);
        infalls.forEach((s, i) => {
          arr[i*3] = Math.cos(s.a) * s.r;
          arr[i*3+1] = s.y;
          arr[i*3+2] = Math.sin(s.a) * s.r;
        });
        gl.useProgram(progInfall.p);
        gl.bindVertexArray(vaoInfall);
        gl.bindBuffer(gl.ARRAY_BUFFER, infallBuf);
        gl.bufferData(gl.ARRAY_BUFFER, arr, gl.DYNAMIC_DRAW);
        gl.uniformMatrix4fv(progInfall.u.uMVP, false, MVP);
        gl.uniform1f(progInfall.u.uPoint, Math.max(canvas.height / 800, 0.8));
        gl.drawArrays(gl.POINTS, 0, infalls.length);
      }
      gl.depthMask(true);
      gl.disable(gl.DEPTH_TEST);
      gl.disable(gl.BLEND);

      drawPass(progBright, bright.fbo, bright.w, bright.h, scene.tex, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      drawPass(progBlur, blurA.fbo, blurA.w, blurA.h, bright.tex, 0);
      gl.uniform2f(progBlur.u.uDir, 1.2 / blurA.w, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      drawPass(progBlur, blurB.fbo, blurB.w, blurB.h, blurA.tex, 0);
      gl.uniform2f(progBlur.u.uDir, 0, 1.2 / blurB.h);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      drawPass(progBlur, blurA.fbo, blurA.w, blurA.h, blurB.tex, 0);
      gl.uniform2f(progBlur.u.uDir, 2.4 / blurA.w, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      drawPass(progBlur, blurB.fbo, blurB.w, blurB.h, blurA.tex, 0);
      gl.uniform2f(progBlur.u.uDir, 0, 2.4 / blurB.h);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      drawPass(progBlur, streak.fbo, streak.w, streak.h, bright.tex, 0);
      gl.uniform2f(progBlur.u.uDir, 5.5 / streak.w, 0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(progComp.p);
      bindQuad(progComp);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, blurB.tex);
      gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, streak.tex);
      gl.uniform1i(progComp.u.uScene, 0);
      gl.uniform1i(progComp.u.uBloom, 1);
      gl.uniform1i(progComp.u.uStreak, 2);
      gl.uniform2f(progComp.u.uRes, canvas.width, canvas.height);
      gl.uniform1f(progComp.u.uTime, t);
      gl.uniform1f(progComp.u.uCA, 0.18 + pulseAmp * 0.35);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.bindVertexArray(null);

      if (!glChecked) {
        glChecked = true;
        const err = gl.getError();
        if (err) showFail("WebGL error " + err);
      }

      frames++;
      if (now - fpsT > 650) {
        fps = Math.round(frames * 1000 / (now - fpsT));
        frames = 0; fpsT = now;
        document.getElementById("fps").textContent = String(fps);
        document.getElementById("st").textContent = String(steps);
        document.getElementById("pu").textContent = pulseAmp.toFixed(2);
        const mm = Math.floor(proper / 60);
        const ss = Math.floor(proper % 60);
        const cc = Math.floor((proper % 1) * 100);
        document.getElementById("tau").innerHTML =
          String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0") + ".<span>" + String(cc).padStart(2, "0") + "</span>";
        document.getElementById("rad").textContent = cam.dist.toFixed(2) + " Rs";
        const z = 1 / Math.sqrt(Math.max(0.05, 1 - 1 / Math.max(cam.dist, 1.05))) - 1;
        document.getElementById("zed").textContent = z.toFixed(3);
        const layerEl = document.getElementById("layer");
        layerEl.textContent = cam.dist > 28 ? "DEEP FIELD" : cam.dist > 14 ? "THE WELL" : cam.dist > 8 ? "PHOTON SPHERE" : cam.dist > 4.6 ? "THE THROAT" : "INNER COSMOS";
        if (filterNode && ac) {
          filterNode.frequency.value = 180 + cam.dist * 8 + pulseAmp * 280 + Math.sin(t * 0.35) * 30;
        }
        if (fps < 36 && steps > 28) { steps -= 4; if (!mobile && renderScale > 0.45) { renderScale *= 0.92; resizeRT(); } }
        else if (fps > 56 && steps < stepsTarget) steps += 2;
      }
      if (analyser && waveData) {
        analyser.getByteFrequencyData(waveData);
        waveBars.forEach((bar, i) => {
          const v = waveData[i % waveData.length] / 255;
          bar.style.height = (3 + v * 19) + "px";
        });
      } else {
        waveBars.forEach((bar, i) => {
          bar.style.height = (3 + (Math.sin(t * 2.2 + i * 0.45) * 0.5 + 0.5) * 10) + "px";
        });
      }
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
