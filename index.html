<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>PRISM / Cymatics</title>
  <style>
    html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; cursor: grab; }
    body.drag { cursor: grabbing; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #hud {
      position: fixed; inset: 0; pointer-events: none;
      font: 11px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: rgba(232, 196, 140, 0.72);
      letter-spacing: 0.14em;
      padding: 18px 20px;
    }
    #hud b { color: #f0d7a8; font-weight: 500; }
    .tl { position: absolute; top: 18px; left: 20px; }
    .tr { position: absolute; top: 18px; right: 20px; text-align: right; }
    .bl { position: absolute; bottom: 18px; left: 20px; opacity: 0.45; font-size: 10px; }
    #fail {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      color: #e8c48c; font: 13px/1.5 ui-monospace, monospace; padding: 40px;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="tl">Hz<br><b id="hz">440.0</b></div>
    <div class="tr">Modal Mode (m, n)<br><b id="mode">1, 2</b></div>
    <div class="bl">N <b id="count">131072</b> · click audio · scroll frequency</div>
  </div>
  <div id="fail"></div>
  <script id="prism-core">
  var PRISM = (function () {
    var PI = Math.PI;
    var COUNT = 131072;
    var L = 2;
    var HZ_MIN = 20;
    var HZ_MAX = 20000;
    function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
    function chladniField(x, y, z, m, n, l, box) {
      box = box == null ? L : box;
      var px = x / box, py = y / box, pz = z / box;
      return Math.cos(n * PI * px) * Math.cos(m * PI * py)
           - Math.cos(m * PI * px) * Math.cos(n * PI * py);
    }
    function chladniZ(z, l, box) {
      box = box == null ? L : box;
      return Math.cos(l * PI * z / box);
    }
    function hzFromT(t) {
      t = clamp(t, 0, 1);
      return HZ_MIN * Math.pow(HZ_MAX / HZ_MIN, t);
    }
    function tFromHz(hz) {
      hz = clamp(hz, HZ_MIN, HZ_MAX);
      return Math.log(hz / HZ_MIN) / Math.log(HZ_MAX / HZ_MIN);
    }
    function modePairs() {
      var pairs = [];
      for (var s = 3; s <= 16; s++) {
        for (var m = 1; m < s; m++) {
          var n = s - m;
          if (m < n) pairs.push([m, n]);
        }
      }
      return pairs;
    }
    var PAIRS = modePairs();
    function modesFromHz(hz) {
      var t = tFromHz(hz);
      var idx = Math.min(PAIRS.length - 1, Math.floor(t * PAIRS.length));
      if (idx < 0) idx = 0;
      var p = PAIRS[idx];
      var l = 1 + Math.floor(t * 5);
      if (l < 1) l = 1;
      if (l > 5) l = 5;
      return { m: p[0], n: p[1], l: l };
    }
    function fieldGrad(x, y, z, m, n, l, box) {
      var e = 0.002;
      var f = chladniField(x, y, z, m, n, l, box);
      return {
        f: f,
        gx: (chladniField(x + e, y, z, m, n, l, box) - f) / e,
        gy: (chladniField(x, y + e, z, m, n, l, box) - f) / e,
        gz: (chladniZ(z + e, l, box) - chladniZ(z, l, box)) / e
      };
    }
    function stepParticle(state, params) {
      params = params || {};
      var m = params.m, n = params.n, l = params.l == null ? 1 : params.l;
      var box = params.L == null ? L : params.L;
      var dt = params.dt == null ? 0.016 : params.dt;
      var attract = params.attract == null ? 2.4 : params.attract;
      var damp = params.damp == null ? 0.94 : params.damp;
      var jitter = params.jitter == null ? 0.002 : params.jitter;
      var scatter = params.scatter == null ? 0 : params.scatter;
      var zPull = params.zPull == null ? 1.1 : params.zPull;
      var g = fieldGrad(state.x, state.y, state.z, m, n, l, box);
      var fz = chladniZ(state.z, l, box);
      state.vx -= attract * g.f * g.gx * dt;
      state.vy -= attract * g.f * g.gy * dt;
      state.vz -= zPull * fz * g.gz * dt;
      state.vx *= damp;
      state.vy *= damp;
      state.vz *= damp;
      var j = jitter * (1 + scatter * 8);
      state.vx += (Math.random() - 0.5) * j;
      state.vy += (Math.random() - 0.5) * j;
      state.vz += (Math.random() - 0.5) * j;
      state.x += state.vx * dt;
      state.y += state.vy * dt;
      state.z += state.vz * dt;
      var h = box * 0.5;
      if (state.x > h || state.x < -h) { state.x = clamp(state.x, -h, h); state.vx *= -0.4; }
      if (state.y > h || state.y < -h) { state.y = clamp(state.y, -h, h); state.vy *= -0.4; }
      if (state.z > h || state.z < -h) { state.z = clamp(state.z, -h, h); state.vz *= -0.4; }
      return state;
    }
    return {
      COUNT: COUNT,
      L: L,
      HZ_MIN: HZ_MIN,
      HZ_MAX: HZ_MAX,
      chladniField: chladniField,
      chladniZ: chladniZ,
      hzFromT: hzFromT,
      tFromHz: tFromHz,
      modesFromHz: modesFromHz,
      stepParticle: stepParticle,
      fieldGrad: fieldGrad
    };
  })();
  if (typeof window !== "undefined") window.PRISM = PRISM;
  if (typeof module !== "undefined" && module.exports) module.exports = PRISM;
  </script>
  <script>
  (() => {
    const canvas = document.getElementById("c");
    const failEl = document.getElementById("fail");
    const mobile = matchMedia("(pointer: coarse)").matches || innerWidth < 740;
    const N = PRISM.COUNT;
    const L = PRISM.L;

    function fail(msg) {
      failEl.style.display = "flex";
      failEl.textContent = msg;
    }

    const gl = canvas.getContext("webgl2", {
      alpha: false,
      antialias: false,
      depth: false,
      powerPreference: "high-performance"
    });
    if (!gl) { fail("WebGL2 required."); return; }

    function compile(type, src, name) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        throw new Error(name + "\n" + gl.getShaderInfoLog(s));
      }
      return s;
    }
    function link(vs, fs, varyings) {
      const p = gl.createProgram();
      gl.attachShader(p, vs);
      if (fs) gl.attachShader(p, fs);
      if (varyings) gl.transformFeedbackVaryings(p, varyings, gl.SEPARATE_ATTRIBS);
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(p));
      }
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        u[info.name] = gl.getUniformLocation(p, info.name);
      }
      return { p, u };
    }

    const VS_UPDATE = `#version 300 es
    in vec3 aPos;
    in vec3 aVel;
    out vec3 vPos;
    out vec3 vVel;
    uniform float uM, uN, uL, uBox, uDt, uAttract, uDamp, uJitter, uScatter, uZPull, uTime;
    float hash(vec3 p){
      return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453);
    }
    float fieldXY(vec3 p){
      float px = p.x / uBox, py = p.y / uBox;
      float cnx = cos(uN * 3.14159265 * px);
      float cmx = cos(uM * 3.14159265 * px);
      float cny = cos(uN * 3.14159265 * py);
      float cmy = cos(uM * 3.14159265 * py);
      return cnx * cmy - cmx * cny;
    }
    float fieldZ(vec3 p){
      return cos(uL * 3.14159265 * p.z / uBox);
    }
    void main(){
      vec3 p = aPos;
      vec3 v = aVel;
      float e = 0.0025;
      float f = fieldXY(p);
      vec3 g = vec3(
        (fieldXY(p + vec3(e,0,0)) - f) / e,
        (fieldXY(p + vec3(0,e,0)) - f) / e,
        (fieldZ(p + vec3(0,0,e)) - fieldZ(p)) / e
      );
      float fz = fieldZ(p);
      v -= uAttract * f * vec3(g.x, g.y, 0.0);
      v.z -= uZPull * fz * g.z;
      v *= uDamp;
      vec3 rnd = vec3(
        hash(p + uTime),
        hash(p.yzx + uTime * 1.7),
        hash(p.zxy + uTime * 0.9)
      ) - 0.5;
      v += rnd * uJitter * (1.0 + uScatter * 10.0);
      p += v * uDt;
      float h = uBox * 0.5;
      if (abs(p.x) > h) { p.x = clamp(p.x, -h, h); v.x *= -0.4; }
      if (abs(p.y) > h) { p.y = clamp(p.y, -h, h); v.y *= -0.4; }
      if (abs(p.z) > h) { p.z = clamp(p.z, -h, h); v.z *= -0.4; }
      vPos = p;
      vVel = v;
      gl_Position = vec4(0.0);
    }`;

    const FS_DUMMY = `#version 300 es
    precision mediump float;
    out vec4 o;
    void main(){ o = vec4(0.0); }`;

    const VS_DRAW = `#version 300 es
    in vec3 aPos;
    uniform mat4 uMVP;
    uniform float uPoint;
    void main(){
      gl_Position = uMVP * vec4(aPos, 1.0);
      gl_PointSize = uPoint / max(gl_Position.w, 0.35);
    }`;

    const FS_DRAW = `#version 300 es
    precision mediump float;
    out vec4 o;
    void main(){
      vec2 q = gl_PointCoord * 2.0 - 1.0;
      float d = dot(q, q);
      if (d > 1.0) discard;
      float g = exp(-d * 3.6);
      o = vec4(vec3(1.0, 0.82, 0.52) * g, 1.0);
    }`;

    let progUp, progDraw;
    try {
      progUp = link(compile(gl.VERTEX_SHADER, VS_UPDATE, "UP"), compile(gl.FRAGMENT_SHADER, FS_DUMMY, "DUM"), ["vPos", "vVel"]);
      progDraw = link(compile(gl.VERTEX_SHADER, VS_DRAW, "DRAW VS"), compile(gl.FRAGMENT_SHADER, FS_DRAW, "DRAW FS"));
    } catch (err) {
      fail(String(err.message || err));
      return;
    }

    const posA = new Float32Array(N * 3);
    const velA = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      posA[i * 3] = (Math.random() - 0.5) * L;
      posA[i * 3 + 1] = (Math.random() - 0.5) * L;
      posA[i * 3 + 2] = (Math.random() - 0.5) * L * 0.12;
    }
    function makeBuf(data) {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_COPY);
      return b;
    }
    const posBuf = [makeBuf(posA), makeBuf(posA)];
    const velBuf = [makeBuf(velA), makeBuf(velA)];

    const vaoUp = gl.createVertexArray();
    const vaoDraw = gl.createVertexArray();
    gl.bindVertexArray(vaoUp);
    gl.enableVertexAttribArray(0);
    gl.enableVertexAttribArray(1);
    gl.bindVertexArray(vaoDraw);
    gl.enableVertexAttribArray(0);
    gl.bindVertexArray(null);
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    const tf = gl.createTransformFeedback();
    let cur = 0;

    function bindUpdateSrc(i) {
      gl.bindVertexArray(vaoUp);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf[i]);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, velBuf[i]);
      gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, null);
    }
    function bindDrawSrc(i) {
      gl.bindVertexArray(vaoDraw);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf[i]);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, null);
    }

    function perspective(fov, aspect, near, far) {
      const f = 1 / Math.tan(fov / 2);
      const nf = 1 / (near - far);
      return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0
      ]);
    }
    function lookAt(ex, ey, ez) {
      let zx = ex, zy = ey, zz = ez;
      const zl = 1 / Math.hypot(zx, zy, zz);
      zx *= zl; zy *= zl; zz *= zl;
      let xx = -zy, xy = zx, xz = 0;
      let xl = Math.hypot(xx, xy, xz);
      if (xl < 1e-6) { xx = 1; xy = 0; xz = 0; xl = 1; }
      xx /= xl; xy /= xl; xz /= xl;
      const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
      return new Float32Array([
        xx, yx, zx, 0,
        xy, yy, zy, 0,
        xz, yz, zz, 0,
        -(xx * ex + xy * ey + xz * ez),
        -(yx * ex + yy * ey + yz * ez),
        -(zx * ex + zy * ey + zz * ez), 1
      ]);
    }
    function mul4(a, b) {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) {
        for (let r = 0; r < 4; r++) {
          o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
        }
      }
      return o;
    }

    const params = new URLSearchParams(location.search);
    const qHz = parseFloat(params.get("hz") || "");
    let tFreq = Number.isFinite(qHz) ? PRISM.tFromHz(qHz) : PRISM.tFromHz(220);
    let vFreq = 0;
    let hz = PRISM.hzFromT(tFreq);
    let modes = PRISM.modesFromHz(hz);
    let scatter = 0;
    let prevMN = modes.m + "," + modes.n + "," + modes.l;

    const cam = { yaw: 0.62, pitch: 0.55, dist: 2.35, vy: 0, vp: 0 };
    let down = false, lx = 0, ly = 0, moved = 0, pinch = 0;

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.max(2, Math.floor(innerWidth * dpr));
      canvas.height = Math.max(2, Math.floor(innerHeight * dpr));
    }
    resize();
    addEventListener("resize", resize, { passive: true });

    canvas.addEventListener("pointerdown", (e) => {
      down = true; moved = 0; lx = e.clientX; ly = e.clientY;
      document.body.classList.add("drag");
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    });
    addEventListener("pointerup", (e) => {
      document.body.classList.remove("drag");
      if (down && moved < 6) toggleAudio();
      down = false;
    });
    addEventListener("pointermove", (e) => {
      if (!down) return;
      const dx = e.clientX - lx, dy = e.clientY - ly;
      moved += Math.abs(dx) + Math.abs(dy);
      cam.vy += dx * 0.005;
      cam.vp += dy * 0.004;
      lx = e.clientX; ly = e.clientY;
    }, { passive: true });
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const mag = Math.min(Math.abs(e.deltaY), 120);
      vFreq += Math.sign(e.deltaY) * mag * 0.00022;
    }, { passive: false });
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        pinch = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });
    canvas.addEventListener("touchmove", (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const d = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        cam.dist = Math.max(1.6, Math.min(8, cam.dist * Math.exp(-(d - pinch) * 0.01)));
        pinch = d;
      }
    }, { passive: false });

    let ac, master, oscs = [];
    let audioOn = false;
    function buildAudio() {
      if (ac) return;
      ac = new AudioContext();
      master = ac.createGain();
      master.gain.value = 0;
      master.connect(ac.destination);
      const specs = [
        { type: "sine", mult: 1, g: 0.11 },
        { type: "sine", mult: 2, g: 0.028 },
        { type: "sine", mult: 3, g: 0.012 },
        { type: "triangle", mult: 1, g: 0.018 }
      ];
      specs.forEach((s) => {
        const o = ac.createOscillator();
        o.type = s.type;
        o.frequency.value = hz * s.mult;
        const g = ac.createGain();
        g.gain.value = s.g;
        o.connect(g).connect(master);
        o.start();
        oscs.push({ o, g, mult: s.mult });
      });
    }
    function toggleAudio() {
      buildAudio();
      if (ac.state === "suspended") ac.resume();
      audioOn = !audioOn;
      const t = ac.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.setValueAtTime(master.gain.value, t);
      master.gain.linearRampToValueAtTime(audioOn ? 0.9 : 0.0001, t + 0.12);
    }
    function syncAudio() {
      if (!ac) return;
      oscs.forEach((s) => {
        s.o.frequency.setTargetAtTime(Math.max(20, hz * s.mult), ac.currentTime, 0.04);
      });
    }

    document.getElementById("count").textContent = String(N);

    let last = performance.now();
    function loop(now) {
      requestAnimationFrame(loop);
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      vFreq *= 0.9;
      tFreq = Math.max(0, Math.min(1, tFreq + vFreq * dt * 18));
      hz = PRISM.hzFromT(tFreq);
      modes = PRISM.modesFromHz(hz);
      const mn = modes.m + "," + modes.n + "," + modes.l;
      if (mn !== prevMN) { scatter = 1; prevMN = mn; }
      scatter *= Math.pow(0.15, dt);

      cam.vy *= 0.9; cam.vp *= 0.9;
      cam.yaw += cam.vy;
      cam.pitch = Math.max(-1.15, Math.min(1.2, cam.pitch + cam.vp));
      const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
      const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
      const ex = cam.dist * cy * cp, ey = cam.dist * sp, ez = cam.dist * sy * cp;
      const P = perspective(0.85, canvas.width / canvas.height, 0.12, 40);
      const V = lookAt(ex, ey, ez);
      const MVP = mul4(P, V);

      gl.useProgram(progUp.p);
      gl.uniform1f(progUp.u.uM, modes.m);
      gl.uniform1f(progUp.u.uN, modes.n);
      gl.uniform1f(progUp.u.uL, modes.l);
      gl.uniform1f(progUp.u.uBox, L);
      gl.uniform1f(progUp.u.uDt, Math.min(dt, 0.02));
      gl.uniform1f(progUp.u.uAttract, 6.5);
      gl.uniform1f(progUp.u.uDamp, 0.93);
      gl.uniform1f(progUp.u.uJitter, 0.0025);
      gl.uniform1f(progUp.u.uScatter, scatter);
      gl.uniform1f(progUp.u.uZPull, 2.2);
      gl.uniform1f(progUp.u.uTime, now * 0.001);
      const sub = 4;
      for (let s = 0; s < sub; s++) {
        const nxt = 1 - cur;
        bindUpdateSrc(cur);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, tf);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, posBuf[nxt]);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, velBuf[nxt]);
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, N);
        gl.endTransformFeedback();
        gl.disable(gl.RASTERIZER_DISCARD);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);
        gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 1, null);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.bindVertexArray(null);
        cur = nxt;
      }

      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0.0196, 0.0196, 0.0196, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE);
      gl.useProgram(progDraw.p);
      bindDrawSrc(cur);
      gl.uniformMatrix4fv(progDraw.u.uMVP, false, MVP);
      gl.uniform1f(progDraw.u.uPoint, Math.max(canvas.height / 380, 1.8));
      gl.drawArrays(gl.POINTS, 0, N);
      gl.disable(gl.BLEND);
      gl.bindVertexArray(null);

      document.getElementById("hz").textContent = hz.toFixed(1);
      document.getElementById("mode").textContent = modes.m + ", " + modes.n;
      document.title = hz.toFixed(1) + "|" + modes.m + "," + modes.n + "|" + N;
      document.documentElement.setAttribute("data-hz", hz.toFixed(1));
      document.documentElement.setAttribute("data-mode", modes.m + "," + modes.n);
      document.documentElement.setAttribute("data-count", String(N));
      syncAudio();
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
