<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRISM — Event Horizon</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030305;color:#e8e2d7;font-family:'Space Grotesk',sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.hud{position:fixed;inset:0;padding:34px 42px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:10px;letter-spacing:.28em;color:#9b968e}.title{font:600 clamp(38px,6vw,88px) Cinzel,serif;letter-spacing:.08em;line-height:.9;margin-top:12px}.sub{font-size:11px;letter-spacing:.25em;color:#8c877f;margin-top:18px}.meta{font-size:10px;letter-spacing:.15em;text-align:right;color:#77736d;line-height:2}.bottom{display:flex;justify-content:space-between;align-items:end}.hint{font-size:10px;letter-spacing:.18em;color:#77736d}.readout{display:flex;gap:30px;font-size:10px;letter-spacing:.12em;color:#aaa49b}.readout b{display:block;color:#eee8dc;font-size:15px;font-weight:400;margin-top:5px}.sound{pointer-events:auto;border:1px solid #5d5953;background:#111114;color:#e8e2d7;padding:11px 15px;font:10px 'Space Grotesk';letter-spacing:.15em;cursor:pointer;transition:.25s}.sound:hover{background:#d9d0c0;color:#09090b}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.48) 100%)}.mark{position:fixed;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:1px solid rgba(238,230,215,.25);border-radius:50%;pointer-events:none}.mark:after{content:'';position:absolute;left:50%;top:-5px;height:44px;border-left:1px solid rgba(238,230,215,.12)}.mark:before{content:'';position:absolute;top:50%;left:-5px;width:44px;border-top:1px solid rgba(238,230,215,.12)}@media(max-width:600px){.hud{padding:24px}.meta{display:none}.readout{gap:15px}.hint{max-width:150px;line-height:1.5}}</style></head><body><canvas id="c"></canvas><div class="vignette"></div><div class="mark"></div><main class="hud"><div class="top"><div><div class="eyebrow">PRISM / 001 — OBSERVATORY</div><div class="title">EVENT<br>HORIZON</div><div class="sub">A study in light, gravity &amp; time</div></div><div class="meta">LOCALITY: 04° 12′ 09″<br>FIELD: ACTIVE<br>VESSEL: ORBITAL-7</div></div><div class="bottom"><div class="hint">DRAG TO DISTORT · MOVE TO ORBIT<br>TOUCH ENABLED / LOW LATENCY FIELD</div><div class="readout"><span>VELOCITY<b id="vel">0.00</b></span><span>CORE TEMP<b>9.8K</b></span><button class="sound" id="sound">◎ SOUND OFF</button></div></div></main><script type="module">import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';const canvas=document.querySelector('#c'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.set(0,1.2,8);const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=4;controls.maxDistance=13;controls.autoRotate=true;controls.autoRotateSpeed=.18;const N=18000,pos=new Float32Array(N*3),col=new Float32Array(N*3),gold=new THREE.Color('#d6b78c'),violet=new THREE.Color('#735f9b'),white=new THREE.Color('#fff5df');for(let i=0;i<N;i++){let a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.55)*4.7,y=(Math.random()-.5)*.42*(1-r/5);let wob=Math.sin(r*3)*.08;pos[i*3]=Math.cos(a)*r;pos[i*3+1]=y+wob;pos[i*3+2]=Math.sin(a)*r;let c=gold.clone().lerp(violet,Math.random()*.75);c.lerp(white,Math.random()*.18);col.set([c.r,c.g,c.b],i*3)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));const mat=new THREE.PointsMaterial({size:.022,vertexColors:true,transparent:true,opacity:.82,blending:THREE.AdditiveBlending,depthWrite:false});scene.add(new THREE.Points(geo,mat));const ring=new THREE.Mesh(new THREE.TorusGeometry(1.08,.018,12,180),new THREE.MeshBasicMaterial({color:'#e6c99b',transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2;scene.add(ring);const core=new THREE.Mesh(new THREE.SphereGeometry(.58,32,32),new THREE.MeshBasicMaterial({color:'#000006'}));scene.add(core);let t=0,last=performance.now(),audio,osc,gain;document.querySelector('#sound').onclick=()=>{if(!audio){audio=new AudioContext();osc=audio.createOscillator();gain=audio.createGain();osc.type='sine';osc.frequency.value=48;gain.gain.value=.018;osc.connect(gain).connect(audio.destination);osc.start()}if(audio.state==='suspended')audio.resume();let on=document.querySelector('#sound').textContent.includes('OFF');gain.gain.value=on?.018:0;document.querySelector('#sound').textContent=on?'◎ SOUND ON':'◎ SOUND OFF'};function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;t+=dt;const p=geo.attributes.position.array;for(let i=0;i<N;i++){let x=p[i*3],z=p[i*3+2],a=Math.atan2(z,x),r=Math.hypot(x,z),na=a+dt*(.16+1.2/(r+.5));p[i*3]=Math.cos(na)*r;p[i*3+2]=Math.sin(na)*r;p[i*3+1]+=(Math.sin(t*1.4+r*2.8)*.0008)}geo.attributes.position.needsUpdate=true;ring.rotation.z=t*.12;ring.scale.setScalar(1+Math.sin(t*1.7)*.025);controls.update();document.querySelector('#vel').textContent=(.12+Math.abs(Math.sin(t*.7))*.88).toFixed(2);renderer.render(scene,camera)}animate(0);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
