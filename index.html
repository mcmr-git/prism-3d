<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PRISM — Event Horizon</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#030305;color:#e8e2d7;font-family:'Space Grotesk',sans-serif}#c{position:fixed;left:0;top:0;display:block;width:100vw;height:100vh;width:100dvw;height:100dvh;touch-action:none}.hud{position:fixed;inset:0;padding:34px 42px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:flex-start}.bottom{align-items:end}.eyebrow{font-size:10px;letter-spacing:.28em;color:#9b968e}.title{font:600 clamp(38px,6vw,88px) Cinzel,serif;letter-spacing:.08em;line-height:.9;margin-top:12px}.sub{font-size:11px;letter-spacing:.25em;color:#8c877f;margin-top:18px}.meta,.hint{font-size:10px;letter-spacing:.18em;color:#77736d;line-height:2}.meta{text-align:right}.readout{display:flex;gap:30px;font-size:10px;letter-spacing:.12em;color:#aaa49b}.readout b{display:block;color:#eee8dc;font-size:15px;font-weight:400;margin-top:5px}.sound{pointer-events:auto;border:1px solid #5d5953;background:#111114;color:#e8e2d7;padding:11px 15px;font:10px 'Space Grotesk';letter-spacing:.15em}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.48) 100%)}.mark{position:fixed;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);border:1px solid #ffffff40;border-radius:50%;pointer-events:none}@media(max-width:600px){.hud{padding:24px 20px}.meta{display:none}.readout{gap:12px}.hint{max-width:150px;line-height:1.5}.title{font-size:clamp(34px,12vw,60px)}} </style></head><body><canvas id="c" aria-label="Interactive particle field"></canvas><div class="vignette"></div><div class="mark"></div><main class="hud"><div class="top"><div><div class="eyebrow">PRISM / 001 — OBSERVATORY</div><div class="title">EVENT<br>HORIZON</div><div class="sub">A study in light, gravity &amp; time</div></div><div class="meta">LOCALITY: 04° 12′ 09″<br>FIELD: ACTIVE<br>VESSEL: ORBITAL-7</div></div><div class="bottom"><div class="hint">DRAG TO DISTORT · MOVE TO ORBIT<br>TOUCH ENABLED / LOW LATENCY FIELD</div><div class="readout"><span>VELOCITY<b id="vel">0.00</b></span><span>CORE TEMP<b>9.8K</b></span><button class="sound" id="sound">◎ SOUND OFF</button></div></div></main><script type="module">import*as THREE from'https://unpkg.com/three@0.160.0/build/three.module.js';import{OrbitControls}from'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';const canvas=document.getElementById('c'),mobile=matchMedia('(max-width: 700px), (pointer: coarse)').matches,N=mobile?6500:14000;let renderer;try{renderer=new THREE.WebGLRenderer({canvas,antialias:!mobile,alpha:false,powerPreference:'default',failIfMajorPerformanceCaveat:false})}catch(e){document.body.innerHTML='<p style="padding:2rem;color:#e8e2d7">WebGL is unavailable on this device.</p>';throw e}renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,100);camera.position.set(0,1.2,8);function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize,{passive:true});addEventListener('orientationchange',()=>setTimeout(resize,250),{passive:true});const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=false;controls.minDistance=4;controls.maxDistance=13;controls.autoRotate=true;controls.autoRotateSpeed=.18;canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});const p=new Float32Array(N*3),co=new Float32Array(N*3),gold=new THREE.Color('#d6b78c'),violet=new THREE.Color('#735f9b'),white=new THREE.Color('#fff5df');for(let i=0;i<N;i++){const a=Math.random()*Math.PI*2,r=Math.pow(Math.random(),.55)*4.7;p[i*3]=Math.cos(a)*r;p[i*3+1]=(Math.random()-.5)*.42*(1-r/5)+Math.sin(r*3)*.08;p[i*3+2]=Math.sin(a)*r;const c=gold.clone().lerp(violet,Math.random()*.75).lerp(white,Math.random()*.18);co.set([c.r,c.g,c.b],i*3)}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(p,3));geo.setAttribute('color',new THREE.BufferAttribute(co,3));scene.add(new THREE.Points(geo,new THREE.PointsMaterial({size:mobile?.032:.022,vertexColors:true,transparent:true,opacity:.82,blending:THREE.AdditiveBlending,depthWrite:false})));const ring=new THREE.Mesh(new THREE.TorusGeometry(1.08,.018,10,120),new THREE.MeshBasicMaterial({color:'#e6c99b',transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2;scene.add(ring);scene.add(new THREE.Mesh(new THREE.SphereGeometry(.58,20,20),new THREE.MeshBasicMaterial({color:'#000006'})));let t=0,last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;t+=dt;for(let i=0;i<N;i++){const x=p[i*3],z=p[i*3+2],a=Math.atan2(z,x),r=Math.hypot(x,z),na=a+dt*(.16+1.2/(r+.5));p[i*3]=Math.cos(na)*r;p[i*3+2]=Math.sin(na)*r;p[i*3+1]+=Math.sin(t*1.4+r*2.8)*.0008}geo.attributes.position.needsUpdate=true;ring.rotation.z=t*.12;ring.scale.setScalar(1+Math.sin(t*1.7)*.025);controls.update();document.getElementById('vel').textContent=(.12+Math.abs(Math.sin(t*.7))*.88).toFixed(2);renderer.render(scene,camera)}animate(performance.now());document.getElementById('sound').onclick=()=>document.getElementById('sound').textContent='◎ SOUND ON';</script></body></html>
